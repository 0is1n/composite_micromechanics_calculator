<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Composite Micromechanics Calculator</title>
<style>
:root{--bg:#f5f6f4;--card:#fff;--ink:#1c2321;--mute:#66706c;--line:#d9dedb;--acc:#0f6b5c;--accbg:#e1f0ec;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121615;--card:#1b2120;--ink:#e8ede9;--mute:#98a39e;--line:#2f3836;--acc:#5fc7b0;--accbg:#1f3a35}}
:root[data-theme="dark"]{--bg:#121615;--card:#1b2120;--ink:#e8ede9;--mute:#98a39e;--line:#2f3836;--acc:#5fc7b0;--accbg:#1f3a35}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,"SF Pro Text",system-ui,"Segoe UI",sans-serif}
main{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}
h2{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
label{display:block;font-size:14px;color:var(--mute);margin-bottom:4px}
input,select{width:100%;font:inherit;font-size:20px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
input:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
button{font:inherit;font-size:16px;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:44px;min-width:44px;cursor:pointer}
button.on{background:var(--accbg);border-color:var(--acc);color:var(--acc)}
.pair{display:flex;gap:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
@media (max-width:700px){.grid,.grid3{grid-template-columns:1fr}}
.mat{overflow-x:auto}
table{border-collapse:collapse;margin:4px 0;border-left:2px solid var(--ink);border-right:2px solid var(--ink);font-variant-numeric:tabular-nums;font-size:18px;width:100%}
table.fulltab{border:none;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
table.fulltab th, table.fulltab td{border:none;padding:8px 10px;text-align:right}
table.fulltab th:first-child, table.fulltab td:first-child{text-align:left}
table.fulltab th{font-size:14px;color:var(--mute);border-bottom:1px solid var(--line)}
td{padding:6px 12px;text-align:right;white-space:nowrap}
.unit{color:var(--mute);font-size:14px}
.err{color:#b3261e;font-size:15px;min-height:1.2em}
.note{color:var(--mute);font-size:14px}
.checkbox-label{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:16px;color:var(--ink);user-select:none}
.checkbox-label input{width:20px;height:20px;accent-color:var(--acc)}
#states, #out { min-height: 20px; width: 100%; }
</style>
</head>
<body>
<main>
<h1>Composite Micromechanics Calculator</h1>

<section class="card">
<h2>Mode</h2>
<div class="row" style="margin-top:0">
<button id="mSingle" class="on">Single Lamina</button>
<button id="mLaminate">Laminate (Layup)</button>
</div>
</section>

<section class="card">
<h2>Material Properties</h2>
<div class="inputs">
<div><label for="E1">E₁ (GPa)</label><input id="E1" inputmode="decimal" autocomplete="off" value="19.755"></div>
<div><label for="E2">E₂ (GPa)</label><input id="E2" inputmode="decimal" autocomplete="off" value="1.9755"></div>
<div><label for="nu">ν₁₂</label><input id="nu" inputmode="decimal" autocomplete="off" value="0.35"></div>
<div><label for="G">G₁₂ (GPa)</label><input id="G" inputmode="decimal" autocomplete="off" value="0.7"></div>
</div>
</section>

<!-- SINGLE LAMINA SECTION -->
<div id="sec-lamina">
<section class="card">
<h2>Lamina Orientation</h2>
<div class="inputs">
<div><label for="th">θ (degrees)</label><div class="pair"><input id="th" inputmode="decimal" autocomplete="off" value="60"><button data-for="th" class="sg" aria-label="Change sign of angle">±</button></div></div>
</div>
<div class="row" id="chips" aria-label="Quick angles"></div>
</section>

<section class="card">
<h2>Lamina Load</h2>
<div class="row" style="margin-top:0">
<button id="kS" class="on">Stress known</button><button id="kE">Strain known</button>
<button id="sXY" class="on">in x-y</button><button id="s12">in 1-2</button>
</div>
<div class="inputs" style="margin-top:12px">
<div><label for="v1" id="l1">σx</label><div class="pair"><input id="v1" inputmode="decimal" autocomplete="off" value="-3.5"><button class="sg" data-for="v1" aria-label="Change sign">±</button></div></div>
<div><label for="v2" id="l2">σy</label><div class="pair"><input id="v2" inputmode="decimal" autocomplete="off" value="7"><button class="sg" data-for="v2" aria-label="Change sign">±</button></div></div>
<div><label for="v3" id="l3">τxy</label><div class="pair"><input id="v3" inputmode="decimal" autocomplete="off" value="-1.4"><button class="sg" data-for="v3" aria-label="Change sign">±</button></div></div>
<div><label for="sunit">Strain unit</label><select id="sunit"><option value="ue">µε (×10⁻⁶)</option><option value="1">plain (ε)</option></select></div>
</div>
<div class="note" style="margin-top:8px">Stress in MPa. Choose unit for strain.</div>
</section>
</div>

<!-- LAMINATE SECTION -->
<div id="sec-laminate" style="display:none">
<section class="card">
<h2>Layup Setup</h2>
<div class="inputs">
<div style="grid-column:1/-1"><label for="layup">Angles [deg] (comma or space separated)</label><input id="layup" autocomplete="off" value="45, 0"></div>
<div style="grid-column:1/-1"><label for="thickness">Thickness t [mm] (single value or comma separated list per ply)</label><input id="thickness" autocomplete="off" value="3, 5"></div>
</div>
<div class="row">
<label class="checkbox-label"><input type="checkbox" id="sym"> Symmetric layup [angles, angles_reversed]</label>
</div>
</section>

<section class="card">
<h2>Laminate Load / Deformation</h2>
<div class="row" style="margin-top:0">
<button id="lkN" class="on">Load known (N, M)</button>
<button id="lkE">Deformation known (ε₀, κ)</button>
</div>
<div class="inputs" style="margin-top:12px">
<div><label for="n1" id="ln1">Nx (N/mm)</label><div class="pair"><input id="n1" inputmode="decimal" autocomplete="off" value="0"><button class="sg" data-for="n1">±</button></div></div>
<div><label for="n2" id="ln2">Ny (N/mm)</label><div class="pair"><input id="n2" inputmode="decimal" autocomplete="off" value="0"><button class="sg" data-for="n2">±</button></div></div>
<div><label for="n3" id="ln3">Nxy (N/mm)</label><div class="pair"><input id="n3" inputmode="decimal" autocomplete="off" value="0"><button class="sg" data-for="n3">±</button></div></div>
<div><label for="m1" id="lm1">Mx (N*mm/mm)</label><div class="pair"><input id="m1" inputmode="decimal" autocomplete="off" value="10"><button class="sg" data-for="m1">±</button></div></div>
<div><label for="m2" id="lm2">My (N*mm/mm)</label><div class="pair"><input id="m2" inputmode="decimal" autocomplete="off" value="0"><button class="sg" data-for="m2">±</button></div></div>
<div><label for="m3" id="lm3">Mxy (N*mm/mm)</label><div class="pair"><input id="m3" inputmode="decimal" autocomplete="off" value="0"><button class="sg" data-for="m3">±</button></div></div>
</div>
</section>

<section class="card">
<h2>Query Point at Distance z from Mid-plane</h2>
<div class="inputs">
<div><label for="zpt">z (mm) [+ve downward]</label><div class="pair"><input id="zpt" inputmode="decimal" autocomplete="off" value="-2.5"><button class="sg" data-for="zpt">±</button></div></div>
</div>
</section>
</div>

<div class="err" id="err" role="alert"></div>

<div id="states"></div>
<div id="out"></div>

</main>
<script>
window.addEventListener('DOMContentLoaded', () => {
 const $=id=>document.getElementById(id);
 const num=id=>parseFloat($(id).value.replace(',','.'));
 const parseArr=id=>$(id).value.split(/[\s,]+/).filter(x=>x.trim()!=='').map(x=>parseFloat(x.replace(',','.')));
 
 const fmt=v=>{if(!isFinite(v))return'–';if(Math.abs(v)<1e-9)return'0';const a=Math.abs(v);
  return (a>=1e6||a<1e-3)?v.toExponential(3):parseFloat(v.toPrecision(5)).toString()};
 const fmtSci=v=>{if(!isFinite(v))return'–';if(Math.abs(v)<1e-12)return'0';return v.toExponential(3)};

 const L={stress:{xy:['σx','σy','τxy'],m:['σ₁','σ₂','τ₁₂']},strain:{xy:['εx','εy','γxy'],m:['ε₁','ε₂','γ₁₂']}};
 
 let mode='lamina'; // 'lamina' | 'laminate'
 let known='stress', sys='xy', lamKnown='load';

 // --- Linear Algebra Utilities ---
 function inv3(m){const[a,b,c,d,e,f,g,h,i]=m;
  const A=e*i-f*h,B=-(d*i-f*g),C=d*h-e*g,det=a*A+b*B+c*C;
  return[A,-(b*i-c*h),b*f-c*e,B,a*i-c*g,-(a*f-c*d),C,-(a*h-b*g),a*e-b*d].map(x=>x/det)}
 
 function inv6(M){
  let A=M.map(r=>[...r]), I=Array.from({length:6},(_,i)=>Array.from({length:6},(_,j)=>i===j?1:0));
  for(let i=0;i<6;i++){
   let pivot=A[i][i];
   if(Math.abs(pivot)<1e-12){
    let swap=-1;
    for(let r=i+1;r<6;r++)if(Math.abs(A[r][i])>Math.abs(pivot)){pivot=A[r][i];swap=r}
    if(swap!==-1){[A[i],A[swap]]=[A[swap],A[i]];[I[i],I[swap]]=[I[swap],I[i]]}
   }
   for(let j=0;j<6;j++){A[i][j]/=pivot;I[i][j]/=pivot}
   for(let r=0;r<6;r++){
    if(r!==i){
     let f=A[r][i];
     for(let c=0;c<6;c++){A[r][c]-=f*A[i][c];I[r][c]-=f*I[i][c]}
    }
   }
  }
  return I;
 }

 const mulv=(M,v)=>[0,1,2].map(i=>M[3*i]*v[0]+M[3*i+1]*v[1]+M[3*i+2]*v[2]);
 const mulv6=(M,v)=>Array.from({length:6},(_,i)=>M[i].reduce((s,val,j)=>s+val*v[j],0));

 function table(m,cols,sci=false){
  let r='<table>';
  let rows = m.length / cols;
  for(let i=0;i<rows;i++){
   r+='<tr>';
   for(let j=0;j<cols;j++){
    let val = m[cols*i+j];
    r+='<td>'+(sci?fmtSci(val):fmt(val))+'</td>';
   }
   r+='</tr>';
  }
  return r+'</table>';
 }

 const card=(t,u,m,c,sci=false)=>'<div class="card mat"><h2>'+t+(u?' <span class="unit">'+u+'</span>':'')+'</h2>'+table(m,c,sci)+'</div>';

 function setLabels(){
  const k=L[known][sys==='xy'?'xy':'m'];['l1','l2','l3'].forEach((id,i)=>$(id).textContent=k[i]);
  if(lamKnown==='load'){
   $('ln1').textContent='Nx (N/mm)';$('ln2').textContent='Ny (N/mm)';$('ln3').textContent='Nxy (N/mm)';
   $('lm1').textContent='Mx (N*mm/mm)';$('lm2').textContent='My (N*mm/mm)';$('lm3').textContent='Mxy (N*mm/mm)';
  }else{
   $('ln1').textContent='ε°x (µε)';$('ln2').textContent='ε°y (µε)';$('ln3').textContent='γ°xy (µε)';
   $('lm1').textContent='κx (1/mm)';$('lm2').textContent='κy (1/mm)';$('lm3').textContent='κxy (1/mm)';
  }
 }

 function getTransforms(th){
  const t=th*Math.PI/180, m=Math.cos(t), n=Math.sin(t), m2=m*m, n2=n*n;
  const Ts=[m2,n2,2*m*n, n2,m2,-2*m*n, -m*n,m*n,m2-n2];
  const Te=[m2,n2,m*n, n2,m2,-m*n, -2*m*n,2*m*n,m2-n2];
  return {Ts, Te, m, n};
 }

 function getGlobalQ(Q, th){
  const {m, n}=getTransforms(th);
  const m2=m*m, n2=n*n;
  const Q11=Q[0], Q12=Q[1], Q22=Q[4], Q66=Q[8];
  const q11=m2*m2*Q11+n2*n2*Q22+2*m2*n2*Q12+4*m2*n2*Q66;
  const q22=n2*n2*Q11+m2*m2*Q22+2*m2*n2*Q12+4*m2*n2*Q66;
  const q12=m2*n2*(Q11+Q22-4*Q66)+(m2*m2+n2*n2)*Q12;
  const q16=m2*m*n*(Q11-Q12-2*Q66)+m*n2*n*(Q12-Q22+2*Q66);
  const q26=m*n2*n*(Q11-Q12-2*Q66)+m2*m*n*(Q12-Q22+2*Q66);
  const q66=m2*n2*(Q11+Q22-2*Q12-2*Q66)+(m2*m2+n2*n2)*Q66;
  return [q11,q12,q16, q12,q22,q26, q16,q26,q66];
 }

 function calc(){
  const E1=num('E1'),E2=num('E2'),nu=num('nu'),G=num('G'),err=$('err');
  if([E1,E2,nu,G].some(isNaN)){err.textContent='Enter a valid number in every material property field.';return}
  if(E1<=0||E2<=0||G<=0){err.textContent='E₁, E₂ and G₁₂ must be positive.';return}
  const nu21=nu*E2/E1,d=1-nu*nu21;
  if(d<=0){err.textContent='ν₁₂ is too large: 1 − ν₁₂ν₂₁ must be positive.';return}
  
  const S=[1/E1,-nu/E1,0, -nu/E1,1/E2,0, 0,0,1/G];
  const Q=[E1/d,nu*E2/d,0, nu*E2/d,E2/d,0, 0,0,G];

  if(mode==='lamina'){
   const th=num('th');
   if(isNaN(th)){err.textContent='Enter a valid lamina angle.';return}
   const inp=[num('v1'),num('v2'),num('v3')];
   if(inp.some(isNaN)){err.textContent='Enter valid numbers in all load fields.';return}
   err.textContent='';

   const Qb=getGlobalQ(Q, th), Sb=inv3(Qb);
   const {Ts, Te}=getTransforms(th);
   const sc=$('sunit').value==='ue'?1e-6:1;
   const QbM=Qb.map(x=>x*1000), SbM=Sb.map(x=>x/1000);

   let sxy, exy;
   if(known==='stress'){
    sxy=sys==='xy'?inp:mulv(inv3(Ts),inp);
    exy=mulv(SbM,sxy);
   }else{
    const e=inp.map(x=>x*sc);
    exy=sys==='xy'?e:mulv(inv3(Te),e);
    sxy=mulv(QbM,exy);
   }
   const s12=mulv(Ts,sxy), e12=mulv(Te,exy), su=sc===1e-6?'[µε]':'[ε]', ec=v=>v.map(x=>x/sc);

   $('states').innerHTML='<div class="grid4">'+
    card('σ_xy','[MPa]',sxy,1)+card('σ_12','[MPa]',s12,1)+
    card('ε_xy',su,ec(exy),1)+card('ε_12',su,ec(e12),1)+'</div>';
   $('out').innerHTML='<div class="grid">'+
    card('Q','[GPa]',Q,3)+card('S','[1/GPa]',S,3)+
    card('Q̄','[GPa]',Qb,3)+card('S̄','[1/GPa]',Sb,3)+'</div>';

  }else{
   // --- LAMINATE MODE ---
   let angles=parseArr('layup'), thArr=parseArr('thickness'), isSym=$('sym').checked;
   if(angles.length===0||angles.some(isNaN)){err.textContent='Enter valid numeric layup angles.';return}
   if(thArr.length===0||thArr.some(isNaN)||thArr.some(x=>x<=0)){err.textContent='Enter positive thickness value(s).';return}

   if(thArr.length===1){thArr=Array(angles.length).fill(thArr[0])}
   else if(thArr.length!==angles.length){err.textContent='Thickness list length must match angles count (or provide a single thickness).';return}

   if(isSym){
    angles=[...angles, ...[...angles].reverse()];
    thArr=[...thArr, ...[...thArr].reverse()];
   }

   const inpN=[num('n1'),num('n2'),num('n3')], inpM=[num('m1'),num('m2'),num('m3')];
   if([...inpN,...inpM].some(isNaN)){err.textContent='Enter valid numbers in all load/deformation fields.';return}
   err.textContent='';

   // Build lamina boundary heights (hb)
   const H=thArr.reduce((a,b)=>a+b,0);
   let hb=[-H/2];
   for(let i=0;i<thArr.length;i++) hb.push(hb[i]+thArr[i]);

   // Build ABD matrix (in N/mm, N, N*mm)
   let A=Array(9).fill(0), B=Array(9).fill(0), D=Array(9).fill(0);
   for(let i=0;i<angles.length;i++){
    const QbM=getGlobalQ(Q, angles[i]).map(x=>x*1000); // GPa to MPa (N/mm2)
    const h0=hb[i], h1=hb[i+1];
    const dt=h1-h0, dt2=(h1*h1 - h0*h0)/2, dt3=(h1*h1*h1 - h0*h0*h0)/3;
    for(let j=0;j<9;j++){
     A[j]+=QbM[j]*dt;
     B[j]+=QbM[j]*dt2;
     D[j]+=QbM[j]*dt3;
    }
   }

   // 6x6 ABD
   let ABD=[];
   for(let r=0;r<3;r++) ABD.push([A[3*r],A[3*r+1],A[3*r+2], B[3*r],B[3*r+1],B[3*r+2]]);
   for(let r=0;r<3;r++) ABD.push([B[3*r],B[3*r+1],B[3*r+2], D[3*r],D[3*r+1],D[3*r+2]]);

   const abd=inv6(ABD);

   let e0, kap, NM;
   if(lamKnown==='load'){
    const sol=mulv6(abd, [...inpN, ...inpM]);
    e0=sol.slice(0,3); kap=sol.slice(3,6);
    NM=[...inpN, ...inpM];
   }else{
    e0=inpN.map(x=>x*1e-6);
    kap=[...inpM];
    NM=mulv6(ABD, [...e0, ...kap]);
   }

   // Equivalent Constants
   const aMat=[[abd[0][0],abd[0][1],abd[0][2]],[abd[1][0],abd[1][1],abd[1][2]],[abd[2][0],abd[2][1],abd[2][2]]];
   const dMat=[[abd[3][3],abd[3][4],abd[3][5]],[abd[4][3],abd[4][4],abd[4][5]],[abd[5][3],abd[5][4],abd[5][5]]];

   const ten={
    Ex:1/(H*aMat[0][0]), Ey:1/(H*aMat[1][1]), Gxy:1/(H*aMat[2][2]),
    mu_xy:-aMat[0][1]/aMat[0][0], mu_yx:-aMat[0][1]/aMat[1][1]
   };
   const ben={
    Ex:12/(Math.pow(H,3)*dMat[0][0]), Ey:12/(Math.pow(H,3)*dMat[1][1]), Gxy:12/(Math.pow(H,3)*dMat[2][2]),
    mu_xy:-dMat[0][1]/dMat[0][0], mu_yx:-dMat[0][1]/dMat[1][1]
   };

   // Point Evaluation
   const zpt=num('zpt');
   let kIdx=0;
   if(!isNaN(zpt)){
    // Clip index to maintain range [0, angles.length - 1]
    let pos=hb.findIndex(h=>h>zpt);
    if(pos===-1) kIdx=angles.length-1;
    else if(pos===0) kIdx=0;
    else kIdx=pos-1;
   }

   const angPt=angles[kIdx];
   const QbPt=getGlobalQ(Q, angPt).map(x=>x*1000);
   const {Ts:TsPt, Te:TePt}=getTransforms(angPt);
   const exyPt=e0.map((e,i)=>e+zpt*kap[i]);
   const sxyPt=mulv(QbPt, exyPt);
   const e12Pt=mulv(TePt, exyPt);
   const s12Pt=mulv(TsPt, sxyPt);

   // Render Results
   let htmlStates='<div class="grid4">'+
    card('Mid-plane strain ε°','[µε]',e0.map(x=>x*1e6),1)+
    card('Curvature κ','[1/mm]',kap,1)+
    card('Load N','[N/mm]',NM.slice(0,3),1)+
    card('Moment M','[N*mm/mm]',NM.slice(3,6),1)+
    '</div>';

   if(!isNaN(zpt)){
    htmlStates+='<h2 style="margin-top:16px">Point Evaluation at z = '+fmt(zpt)+' mm (Lamina '+(kIdx+1)+': θ = '+fmt(angPt)+'°)</h2>'+
    '<div class="grid4">'+
    card('σ_xy','[MPa]',sxyPt,1)+card('σ_12','[MPa]',s12Pt,1)+
    card('ε_xy','[µε]',exyPt.map(x=>x*1e6),1)+card('ε_12','[µε]',e12Pt.map(x=>x*1e6),1)+
    '</div>';
   }
   $('states').innerHTML=htmlStates;

   // Flat ABD / abd for matrix display
   const flatABD=[...ABD[0],...ABD[1],...ABD[2],...ABD[3],...ABD[4],...ABD[5]];
   const flatabd=[...abd[0],...abd[1],...abd[2],...abd[3],...abd[4],...abd[5]];

   let htmlOut='<div class="grid">'+
    card('ABD Matrix','[[A,B],[B,D]]',flatABD,6)+
    card('abd Matrix (inv ABD)','[[a,b],[bᵀ,d]]',flatabd,6,true)+
    '</div>';

   // Equivalent Engineering Constants Card
   htmlOut+='<div class="card mat"><h2>Equivalent Engineering Constants <span class="unit">(Valid for symmetric laminates)</span></h2>'+
    '<table class="fulltab"><thead><tr><th>Property</th><th>Ex (GPa)</th><th>Ey (GPa)</th><th>Gxy (GPa)</th><th>νxy</th><th>νyx</th></tr></thead><tbody>'+
    '<tr><td>Tensile</td><td>'+fmt(ten.Ex*1e-3)+'</td><td>'+fmt(ten.Ey*1e-3)+'</td><td>'+fmt(ten.Gxy*1e-3)+'</td><td>'+fmt(ten.mu_xy)+'</td><td>'+fmt(ten.mu_yx)+'</td></tr>'+
    '<tr><td>Bending</td><td>'+fmt(ben.Ex*1e-3)+'</td><td>'+fmt(ben.Ey*1e-3)+'</td><td>'+fmt(ben.Gxy*1e-3)+'</td><td>'+fmt(ben.mu_xy)+'</td><td>'+fmt(ben.mu_yx)+'</td></tr>'+
    '</tbody></table></div>';

   // Stress Table at Top/Bottom of Each Lamina
   let tblRows='';
   for(let i=0;i<angles.length;i++){
    const ang=angles[i];
    const QbLam=getGlobalQ(Q, ang).map(x=>x*1000);
    const {Ts:TsL}=getTransforms(ang);
    [hb[i], hb[i+1]].forEach(zz=>{
     const exyL=e0.map((e,idx)=>e+zz*kap[idx]);
     const sxyL=mulv(QbLam, exyL);
     const s12L=mulv(TsL, sxyL);
     tblRows+='<tr><td>'+(i+1)+'</td><td>'+fmt(ang)+'°</td><td>'+fmt(zz)+'</td><td>'+fmt(s12L[0])+'</td><td>'+fmt(s12L[1])+'</td><td>'+fmt(s12L[2])+'</td></tr>';
    });
   }

   htmlOut+='<div class="card mat"><h2>Principal Stress σ₁₂ at Ply Surfaces <span class="unit">[MPa]</span></h2>'+
    '<table class="fulltab"><thead><tr><th>Ply</th><th>θ</th><th>z (mm)</th><th>σ₁</th><th>σ₂</th><th>τ₁₂</th></tr></thead><tbody>'+
    tblRows+'</tbody></table></div>';

   $('out').innerHTML=htmlOut;
  }
 }

 // UI Switch Handlers
 $('mSingle').onclick=()=>{
  mode='lamina';
  $('mSingle').classList.add('on');$('mLaminate').classList.remove('on');
  $('sec-lamina').style.display='block';$('sec-laminate').style.display='none';
  calc();
 };
 $('mLaminate').onclick=()=>{
  mode='laminate';
  $('mLaminate').classList.add('on');$('mSingle').classList.remove('on');
  $('sec-lamina').style.display='none';$('sec-laminate').style.display='block';
  calc();
 };

 function pickLamina(){
  $('kS').classList.toggle('on',known==='stress');$('kE').classList.toggle('on',known==='strain');
  $('sXY').classList.toggle('on',sys==='xy');$('s12').classList.toggle('on',sys==='m');
  setLabels();calc();
 }
 $('kS').onclick=()=>{known='stress';pickLamina()};
 $('kE').onclick=()=>{known='strain';pickLamina()};
 $('sXY').onclick=()=>{sys='xy';pickLamina()};
 $('s12').onclick=()=>{sys='m';pickLamina()};

 function pickLaminate(){
  $('lkN').classList.toggle('on',lamKnown==='load');
  $('lkE').classList.toggle('on',lamKnown==='strain');
  setLabels();calc();
 }
 $('lkN').onclick=()=>{lamKnown='load';pickLaminate()};
 $('lkE').onclick=()=>{lamKnown='strain';pickLaminate()};

 document.querySelectorAll('input,select').forEach(i=>{
  i.addEventListener('input',calc);
  i.addEventListener('change',calc);
 });

 document.querySelectorAll('.sg').forEach(b=>b.onclick=()=>{
  const el=$(b.dataset.for),v=parseFloat(el.value.replace(',','.'));
  if(!isNaN(v)){el.value=-v;calc()}
 });

 [0,15,30,45,60,75,90,-45].forEach(a=>{
  const b=document.createElement('button');
  b.textContent=a+'°';
  b.onclick=()=>{$('th').value=a;calc()};
  $('chips').appendChild(b);
 });

 setLabels();calc();
});
</script>
